apiVersion: v1
kind: Service
metadata:
  name: vscode-service
  namespace: rocm-dev
spec:
  clusterIP: None  # Headless service
  selector:
    app: vscode-session
  ports:
    - name: ssh
      port: 22
      targetPort: 22
      protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: vscode-service-external
  namespace: rocm-dev
spec:
  type: NodePort
  selector:
    app: vscode-session
  ports:
    - name: ssh
      port: 22
      targetPort: 22
      nodePort: 30022  # External SSH access
      protocol: TCP
